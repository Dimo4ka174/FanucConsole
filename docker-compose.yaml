services:
  db:
    image: postgres:16-alpine
    container_name: fanuc_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fanuc_data}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fanuc_data}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: fanuc-focas-console:latest
    build: .
    container_name: fanuc_app
    network_mode: host
    env_file:
      - .env
    environment:
      - ConnectionStrings__DefaultConnection=Host=localhost;Port=5432;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};Database=${POSTGRES_DB:-fanuc_data}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: